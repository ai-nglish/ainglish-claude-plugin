name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest "ainglish>=0.2.32,<0.3"
      - run: python -m pytest -q
      - name: skill frontmatter stays portable (write skill uploads beyond Claude Code)
        run: |
          python3 - << 'PY'
          import re, sys
          raw = open('skills/ainglish-write/SKILL.md').read()
          fm = raw.split('---')[1]
          keys = {line.split(':')[0].strip() for line in fm.strip().splitlines() if ':' in line and not line.startswith(' ')}
          allowed = {'name', 'description', 'license', 'compatibility', 'metadata', 'allowed-tools'}
          bad = keys - allowed
          if bad:
              sys.exit(f"non-portable frontmatter keys in ainglish-write: {bad}")
          print("portable:", sorted(keys))
          PY
